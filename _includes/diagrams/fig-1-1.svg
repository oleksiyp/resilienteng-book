<div class="dg-figure" data-fig="fig-1-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 596" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-1-title fig-1-1-desc">
<title id="fig-1-1-title">Encore&#x27;s system map</title>
<desc id="fig-1-1-desc">Fans, organizers, partners and tenants enter through the API gateway. The purchase path runs from the Sale Gate through Bot Screening and Seat Inventory to Orders &amp; Payments and the external payment providers, two of them. Catalog uses a bought search product; Support uses the AI gateway to reach model providers and asks Orders for refunds. Seat Inventory and Orders publish to the ticket-sales.v2 stream, which Notifications, the Finance ledger and Sales Analytics consume.</desc>
