<path class="dg-a dg-a-muted" d="M 236,252 L 204,252" marker-end="url(#fig-1-2-m-muted)"/>
<rect class="dg-mask" x="24" y="56" width="180" height="72" rx="6"/>
<rect class="dg-n dg-n-backend" x="24" y="56" width="180" height="72" rx="6"/>
<rect class="dg-tagbox dg-t-backend" x="32" y="62" width="80" height="12" rx="2"/>
<text class="dg-tag dg-t-backend" x="72" y="71">1 · SALE GATE</text>
<text class="dg-name" x="114" y="98">Wait in the room</text>
<text class="dg-sub" x="114" y="113">queue position, in order</text>
<rect class="dg-mask" x="236" y="56" width="180" height="72" rx="6"/>
<rect class="dg-n dg-n-focal" x="236" y="56" width="180" height="72" rx="6"/>
<rect class="dg-tagbox dg-t-focal" x="244" y="62" width="80" height="12" rx="2"/>
<text class="dg-tag dg-t-focal" x="284" y="71">2 · SALE GATE</text>
<text class="dg-name" x="326" y="98">Admitted</text>
<text class="dg-sub" x="326" y="113">≤ ~1,200 fans/s per event</text>
<rect class="dg-mask" x="448" y="56" width="180" height="72" rx="6"/>
<rect class="dg-n dg-n-backend" x="448" y="56" width="180" height="72" rx="6"/>
<rect class="dg-tagbox dg-t-backend" x="456" y="62" width="100" height="12" rx="2"/>
<text class="dg-tag dg-t-backend" x="506" y="71">3 · BOT SCREENING</text>
<text class="dg-name" x="538" y="98">Screened</text>
<text class="dg-sub" x="538" y="113">edge signals, velocity rules</text>
<rect class="dg-mask" x="660" y="56" width="180" height="72" rx="6"/>
<rect class="dg-n dg-n-backend" x="660" y="56" width="180" height="72" rx="6"/>
<rect class="dg-tagbox dg-t-backend" x="668" y="62" width="156" height="12" rx="2"/>
<text class="dg-tag dg-t-backend" x="746" y="71">4 · CATALOG + SEAT INVENTORY</text>
<text class="dg-name" x="750" y="98">Seat map</text>
<text class="dg-sub" x="750" y="113">shape cached, seats live</text>
<rect class="dg-mask" x="660" y="216" width="180" height="72" rx="6"/>
<rect class="dg-n dg-n-backend" x="660" y="216" width="180" height="72" rx="6"/>
<rect class="dg-tagbox dg-t-backend" x="668" y="222" width="104" height="12" rx="2"/>
<text class="dg-tag dg-t-backend" x="720" y="231">5 · SEAT INVENTORY</text>
<text class="dg-name" x="750" y="258">Hold</text>
<text class="dg-sub" x="750" y="273">POST /holds · 5-min TTL</text>
<rect class="dg-mask" x="448" y="216" width="180" height="72" rx="6"/>
<rect class="dg-n dg-n-focal" x="448" y="216" width="180" height="72" rx="6"/>
<rect class="dg-tagbox dg-t-focal" x="456" y="222" width="120" height="12" rx="2"/>
<text class="dg-tag dg-t-focal" x="516" y="231">6 · ORDERS &amp; PAYMENTS</text>
<text class="dg-name" x="538" y="258">Checkout saga</text>
<text class="dg-sub" x="538" y="273">3 s budget, ~800 ms at PSP</text>
<rect class="dg-mask" x="236" y="216" width="180" height="72" rx="6"/>
<rect class="dg-n dg-n-backend" x="236" y="216" width="180" height="72" rx="6"/>
<rect class="dg-tagbox dg-t-backend" x="244" y="222" width="108" height="12" rx="2"/>
<text class="dg-tag dg-t-backend" x="298" y="231">7 · TICKET-SALES.V2</text>
<text class="dg-name" x="326" y="258">Facts published</text>
<text class="dg-sub" x="326" y="273">SeatSold, TicketIssued</text>
<rect class="dg-mask" x="24" y="216" width="180" height="72" rx="6"/>
<rect class="dg-n dg-n-backend" x="24" y="216" width="180" height="72" rx="6"/>
<rect class="dg-tagbox dg-t-backend" x="32" y="222" width="100" height="12" rx="2"/>
<text class="dg-tag dg-t-backend" x="82" y="231">8 · NOTIFICATIONS</text>
<text class="dg-name" x="114" y="258">Ticket in the wallet</text>
<text class="dg-sub" x="114" y="273">email and wallet pass</text>
<text class="dg-eyebrow" x="24" y="36" style="text-anchor:start">ONE FAN, ON-SALE MORNING · READ ALONG THE ARROWS</text>
<text class="dg-note" x="28" y="148" text-anchor="start">minutes, sometimes an hour;</text>
<text class="dg-note" x="28" y="161" text-anchor="start">the room absorbs the 500×</text>
<text class="dg-note" x="240" y="148" text-anchor="start">the dial that keeps every</text>
<text class="dg-note" x="240" y="161" text-anchor="start">shard under 80% load</text>
<text class="dg-note" x="452" y="148" text-anchor="start">the bots arrive first;</text>
<text class="dg-note" x="452" y="161" text-anchor="start">real fans must pass</text>
<text class="dg-note" x="664" y="148" text-anchor="start">geometry: Catalog&#x27;s cache</text>
<text class="dg-note" x="664" y="161" text-anchor="start">availability: Inventory</text>
<text class="dg-note" x="664" y="308" text-anchor="start">on one of four shards, in</text>
<text class="dg-note" x="664" y="321" text-anchor="start">the event&#x27;s home region</text>
<text class="dg-note" x="452" y="308" text-anchor="start">Idempotency-Key on the buy;</text>
<text class="dg-note" x="452" y="321" text-anchor="start">PSP down: the second PSP</text>
<text class="dg-note" x="240" y="308" text-anchor="start">SaleCompleted feeds</text>
<text class="dg-note" x="240" y="321" text-anchor="start">Finance and Analytics</text>
<text class="dg-note" x="28" y="308" text-anchor="start">one ticket, delivered once:</text>
<text class="dg-note" x="28" y="321" text-anchor="start">the rewrite&#x27;s lesson</text>
