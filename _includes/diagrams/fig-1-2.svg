<div class="dg-figure" data-fig="fig-1-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-2-title fig-1-2-desc">
<title id="fig-1-2-title">One fan&#x27;s purchase, step by step</title>
<desc id="fig-1-2-desc">Eight steps in two rows. The fan waits in the Sale Gate&#x27;s room, is admitted at no more than about 1,200 fans a second per event, passes Bot Screening, sees a seat map whose geometry comes from Catalog&#x27;s cache and whose availability comes from Seat Inventory, holds seats for five minutes with POST /holds, completes a checkout saga within a 3-second budget of which about 800 ms is the payment provider, after which SeatSold and TicketIssued are published and Notifications delivers the ticket to the fan&#x27;s wallet.</desc>
<defs><marker id="fig-1-2-m-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-head dg-head-muted" points="0 0, 8 3, 0 6"/></marker><marker id="fig-1-2-m-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-head dg-head-accent" points="0 0, 8 3, 0 6"/></marker><marker id="fig-1-2-m-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-head dg-head-link" points="0 0, 8 3, 0 6"/></marker></defs>
<rect class="dg-paper" width="100%" height="100%" rx="8"/>
