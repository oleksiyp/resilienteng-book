<div class="dg-figure" data-fig="fig-1-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-3-title fig-1-3-desc">
<title id="fig-1-3-title">Where Encore runs</title>
<desc id="fig-1-3-desc">Two EU regions, EU-1 and EU-2, each with a core Kubernetes cluster, six Professional tenant cells with a database per tenant, a serverless Sale Gate edge and serverless self-service cells of about 50 venues. Fans and partners read from either region. Each event&#x27;s writes are pinned to a home region, where its seat-ledger leader commits each write once three of five replicas hold it: two in the home region, two in the other region and a witness in a third region, EU-3, which stores the log but serves no traffic. Both regions reconcile toward the encore-deploy Git repository.</desc>
