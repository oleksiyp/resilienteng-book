<title id="fig-1-5-title">An error budget burned down by someone else&#x27;s change</title>
<desc id="fig-1-5-desc">The On-Sale team&#x27;s 28-day error budget falls slowly with ordinary spending until a Bot Screening rule blocks real fans and takes 70% of it in 15 minutes, leaving about 23%, below the policy&#x27;s 25% review threshold; a dashed diagonal shows the steady burn that would spend exactly the whole budget in the window.</desc>
