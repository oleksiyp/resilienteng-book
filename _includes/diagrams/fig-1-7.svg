<div class="dg-figure" data-fig="fig-1-7" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 328" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-7-title fig-1-7-desc">
<title id="fig-1-7-title">A multi-window burn-rate page through one incident</title>
<desc id="fig-1-7-desc">The seat map serves 10% bad requests from minute 30 to minute 70. The one-hour bad ratio crosses the 14.4x threshold of 1.44% at about minute 39 and stays above it until about minute 121; the five-minute ratio drops below it about four minutes after the fix, so the page, which needs both, fires at minute 39 and resolves at minute 74.</desc>
