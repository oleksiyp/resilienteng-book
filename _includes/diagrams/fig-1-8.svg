<title id="fig-1-8-title">Serial dependencies multiply</title>
<desc id="fig-1-8-desc">The availability of a journey with one to six hard dependencies in series, if their failures are independent: at 99.95% each, two already reach the 99.9% checkout objective and four give about 99.80%; at 99.99% each, three give about 99.97%, leaving room inside the objective.</desc>
