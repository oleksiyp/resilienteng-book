<div class="dg-figure" data-fig="fig-2-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-1-title fig-2-1-desc">
<title id="fig-2-1-title">A latency distribution and the numbers that summarize it</title>
<desc id="fig-2-1-desc">A seat-map service&#x27;s latency on a log scale has two humps: cache hits around 40 ms and cache misses around 700 ms with a long tail. The median is about 39 ms and the mean about 121 ms, where almost no request falls; the p99 is about 2 s.</desc>
