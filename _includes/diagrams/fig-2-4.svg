<div class="dg-figure" data-fig="fig-2-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-4-title fig-2-4-desc">
<title id="fig-2-4-title">Where one shard stops scaling</title>
<desc id="fig-2-4-desc">Measured write throughput of one Seat Inventory shard at six concurrency levels, with the Universal Scalability Law fitted at sigma 0.03 and kappa 0.0005. Linear scaling and Amdahl&#x27;s law (contention only) rise far above the measurements; the fitted curve peaks at about 1,630 writes/s near 44 writers and falls beyond. The concurrency cap sits at 32, just under the peak.</desc>
