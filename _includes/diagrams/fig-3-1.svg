<div class="dg-figure" data-fig="fig-3-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-1-title fig-3-1-desc">
<title id="fig-3-1-title">Three governors on one lever</title>
<desc id="fig-3-1-desc">A sketch of Catalog&#x27;s replica count over half an hour. An engineer scales it from 20 to 60; within seconds the GitOps agent restores the manifest&#x27;s 20. When browsing ebbs, the autoscaler waits out its five-minute scale-down window and then trims toward its floor of 12; the GitOps agent restores 20 within seconds, and the two trade the count several times a minute for the rest of the half hour, while the engineer believes the service is at 60.</desc>
