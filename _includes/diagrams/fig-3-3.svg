<div class="dg-figure" data-fig="fig-3-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-3-title fig-3-3-desc">
<title id="fig-3-3-title">Governors in a hierarchy</title>
<desc id="fig-3-3-desc">Argo CD pulls Catalog&#x27;s desired state from the encore-deploy repository and writes the autoscaler&#x27;s floor and CPU target; the autoscaler, watching pod CPU, writes spec.replicas; the Deployment controller creates pods; pending pods prompt the cluster autoscaler to add nodes, while the node-upgrade reconciler drains nodes through PodDisruptionBudgets. A manual kubectl scale writes spec.replicas as a second owner and leaves no record; a planned surge instead raises the autoscaler&#x27;s floor in Git.</desc>
