<div class="dg-figure" data-fig="fig-3-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-4-title fig-3-4-desc">
<title id="fig-3-4-title">Upgrade waves across 14 clusters</title>
<desc id="fig-3-4-desc">Each of the two regions, EU-1 and EU-2, runs a core cluster and six Professional cells. A new Kubernetes version reaches the canary cell of internal test tenants in EU-1 first, then the other eleven cells a few at a time, then the two core clusters, with node pools drained through PodDisruptionBudgets and a scan for removed APIs before each wave.</desc>
