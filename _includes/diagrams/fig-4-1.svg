<div class="dg-figure" data-fig="fig-4-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-4-1-title fig-4-1-desc">
<title id="fig-4-1-title">Knight Capital&#x27;s eight servers</title>
<desc id="fig-4-1-desc">Three columns show Knight&#x27;s eight order-router servers. Before 1 August the new code reached seven servers, and the eighth kept the old code with the dormant Power Peg function. At the 09:30 open, seven servers handled the new orders correctly while the eighth woke Power Peg. After engineers rolled the seven back to the old code, all eight ran Power Peg until it was stopped about 45 minutes after the open.</desc>
