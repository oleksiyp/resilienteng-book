<div class="dg-figure" data-fig="fig-4-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-4-4-title fig-4-4-desc">
<title id="fig-4-4-title">A canary over time</title>
<desc id="fig-4-4-desc">Traffic share to the new version on a logarithmic scale against minutes: 1% for at least 10 minutes and 20,000 requests, 5% for 15 minutes, 25% for 20 minutes, then 100%. A second canary follows the same steps until an integrity alarm six minutes into the 25% step sends it straight back to zero.</desc>
