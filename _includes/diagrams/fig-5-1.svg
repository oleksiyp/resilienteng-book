<rect class="dg-mask" x="160" y="198" width="128" height="12" rx="2"/><text class="dg-label" x="224" y="207">NEW YORK · MINOR FAULT</text>
<text class="dg-note" x="608" y="152" text-anchor="end">&quot;back in service&quot;</text>
<text class="dg-note" x="632" y="44" text-anchor="start">trigger: one switch, one minor fault</text>
<text class="dg-note" x="472" y="380" text-anchor="start">The trigger lasted seconds; the loop ran for about nine hours.</text>
<text class="dg-note" x="472" y="396" text-anchor="start">All 114 switches ran the same code, so redundancy could not help.</text>
