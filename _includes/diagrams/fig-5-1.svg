<div class="dg-figure" data-fig="fig-5-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc">
<title id="fig-5-1-title">The AT&amp;T cascade, 1990</title>
<desc id="fig-5-1-desc">Left: a map of switches joined to their neighbors, with the first switch, in New York, at the centre and the waves of resets spreading outward from it. Right: the loop each switch ran. A switch recovers and tells its neighbors it is back in service; a neighbor that receives a second message while still handling the first hits the defect, corrupts its data and resets; when it recovers, it becomes the next sender.</desc>
