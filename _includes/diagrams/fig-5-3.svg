<div class="dg-figure" data-fig="fig-5-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-3-title fig-5-3-desc">
<title id="fig-5-3-title">Retries multiply across layers</title>
<desc id="fig-5-3-desc">Load on a struggling dependency, as a multiple of normal, against the share of its calls that fail. One layer retrying three times can at most quadruple the load; three such layers stacked can multiply it 64 times as failure approaches 100%; a 10% retry budget caps it at 1.1 times.</desc>
