<div class="dg-figure" data-fig="fig-5-6" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-6-title fig-5-6-desc">
<title id="fig-5-6-title">Shuffle sharding in a cell</title>
<desc id="fig-5-6-desc">Eight worker lanes in one self-service cell, with each venue assigned two. Venue A&#x27;s runaway import floods lanes 2 and 5. Venues B and C share one flooded lane each, and their consumers move the work to their other lane; D and E share none; F, by chance, holds the same pair and is hit. Any one neighbor has about a 1-in-28 chance of that, so in a cell of 50 one or two are hit.</desc>
