<div class="dg-figure" data-fig="fig-6-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-2-title fig-6-2-desc">
<title id="fig-6-2-title">RPO and RTO around a failure, promised and measured</title>
<desc id="fig-6-2-desc">A time axis in hours around a failure at zero. The seat ledger promises an RPO of zero and an RTO of minutes. The Finance ledger promises 15 minutes of data loss and two hours to restore; its spring drill took about nine hours, and the second drill had the current year writable in 1 h 50 min, with history following within a day.</desc>
