<div class="dg-figure" data-fig="fig-6-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-4-title fig-6-4-desc">
<title id="fig-6-4-title">Fencing a deposed leader</title>
<desc id="fig-6-4-desc">The old leader of a Seat Inventory shard writes with term 7 and is accepted. It is then paused or cut off. The new leader records term 8 at the storage and writes with it. When the old leader wakes and writes with term 7, the storage rejects the write as stale, and the old leader learns only then that it was replaced.</desc>
