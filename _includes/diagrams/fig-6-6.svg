<div class="dg-figure" data-fig="fig-6-6" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-6-title fig-6-6-desc">
<title id="fig-6-6-title">The region failover game day</title>
<desc id="fig-6-6-desc">EU-1 is isolated from EU-2 and from the witness in EU-3, and every event homed there fails over to EU-2. The core held: the EU-1 seat-ledger leaders lost their majority and stopped writing, leaders were re-elected in EU-2 with the EU-3 witness&#x27;s votes, fencing rejected late writes from the deposed leaders, and the failover took about four minutes end to end. Three edges did not: the Sale Gate was pre-warmed only in EU-1, Bot Screening&#x27;s risk data reached EU-2 only by a daily copy, and an Orders reconciliation job whose schedule named EU-1 sat idle for six hours.</desc>
