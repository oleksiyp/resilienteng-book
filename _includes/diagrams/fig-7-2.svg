<div class="dg-figure" data-fig="fig-7-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-7-2-title fig-7-2-desc">
<title id="fig-7-2-title">Credential lifetimes against a 38-minute revocation</title>
<desc id="fig-7-2-desc">Lifetimes on a logarithmic scale from one minute to beyond a year. Rowmate&#x27;s static API key had lived 26 months and would have lived until someone revoked it; Encore revoked it 38 minutes after the leak. A partner OAuth token lives 15 minutes, a workload SVID one hour, renewed at half-life, and a break-glass session 60 minutes.</desc>
<defs><marker id="fig-7-2-m-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-head dg-head-muted" points="0 0, 8 3, 0 6"/></marker><marker id="fig-7-2-m-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-head dg-head-accent" points="0 0, 8 3, 0 6"/></marker><marker id="fig-7-2-m-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-head dg-head-link" points="0 0, 8 3, 0 6"/></marker></defs>
<rect class="dg-paper" width="100%" height="100%" rx="8"/>
<line class="dg-axis" x1="200" y1="256" x2="832" y2="256"/>
<line class="dg-axis" x1="200" y1="256" x2="200" y2="56"/>
<line class="dg-axis" x1="200.0" y1="256" x2="200.0" y2="260"/>
<text class="dg-tick" x="200.0" y="272" text-anchor="middle">1 MIN</text>
<line class="dg-axis" x1="318.0" y1="256" x2="318.0" y2="260"/>
<text class="dg-tick" x="318.0" y="272" text-anchor="middle">15 MIN</text>
<line class="dg-axis" x1="378.4" y1="256" x2="378.4" y2="260"/>
<text class="dg-tick" x="378.4" y="272" text-anchor="middle">1 H</text>
<line class="dg-axis" x1="516.8" y1="256" x2="516.8" y2="260"/>
<text class="dg-tick" x="516.8" y="272" text-anchor="middle">1 DAY</text>
<line class="dg-axis" x1="665.6" y1="256" x2="665.6" y2="260"/>
<text class="dg-tick" x="665.6" y="272" text-anchor="middle">1 MONTH</text>
<line class="dg-axis" x1="773.9" y1="256" x2="773.9" y2="260"/>
<text class="dg-tick" x="773.9" y="272" text-anchor="middle">1 YEAR</text>
<text class="dg-axis-label" x="832" y="288" text-anchor="end">LIFETIME (LOG SCALE)</text>
