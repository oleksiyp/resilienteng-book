<line class="dg-series dg-s-accent" x1="358.5" y1="52" x2="358.5" y2="256" stroke-dasharray="5 4"/>
<rect class="dg-n dg-n-focal" x="200.0" y="68" width="607.6" height="24" rx="3"/>
