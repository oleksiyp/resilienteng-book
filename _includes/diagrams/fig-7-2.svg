<text class="dg-name" x="104" y="78">Rowmate API key</text><text class="dg-sub" x="104" y="91">static · scoped</text>
<text class="dg-note" x="799" y="84" text-anchor="end">26 months, and valid until revoked</text>
<text class="dg-name" x="104" y="126">Partner token</text><text class="dg-sub" x="104" y="139">OAuth · cert-bound</text>
<text class="dg-note" x="366" y="132" text-anchor="start">15 min: would have expired before the revocation</text>
<text class="dg-name" x="104" y="174">Workload SVID</text><text class="dg-sub" x="104" y="187">SPIRE · renewed at 30 min</text>
<text class="dg-note" x="386" y="180" text-anchor="start">1 h</text>
