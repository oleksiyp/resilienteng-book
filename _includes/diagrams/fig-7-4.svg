<div class="dg-figure" data-fig="fig-7-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-7-4-title fig-7-4-desc">
<title id="fig-7-4-title">Patching a known-exploited flaw in 48 hours</title>
<desc id="fig-7-4-desc">Images redeployed against hours since disclosure. SBOM queries found 37 affected images in 20 minutes; a WAF rule went up within 6 hours; 35 images were redeployed by hour 30 and all 37 of Encore&#x27;s own by hour 48, the deadline. The vendor&#x27;s monitoring agent, confined by an egress rule, was fixed four days later.</desc>
