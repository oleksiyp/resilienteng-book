<div class="dg-figure" data-fig="fig-8-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-8-3-title fig-8-3-desc">
<title id="fig-8-3-title">The golden set catches a moved alias</title>
<desc id="fig-8-3-desc">Nightly golden-set pass rates over nine days. Refund cases pass 18 of 18 every night until the Wednesday run, after the provider moved the cheap tier&#x27;s alias on Tuesday, when they pass 11 of 18; the overall score dips only from 193 to 186 of 200. The previous snapshot is pinned by Wednesday lunchtime, about 30 hours after the move, and Thursday&#x27;s run is back to 18 of 18.</desc>
