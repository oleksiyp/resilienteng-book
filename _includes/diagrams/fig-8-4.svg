<div class="dg-figure" data-fig="fig-8-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-8-4-title fig-8-4-desc">
<title id="fig-8-4-title">The AI request path and its eval loop</title>
<desc id="fig-8-4-desc">Fans reach the support assistant and the refund agent, which call models only through the AI gateway; the gateway sends about 80% of turns to the cheap tier, hard turns to the frontier tier and fails over to a second provider. The refund agent gets a 15-minute token by token exchange, calls tools through the MCP server and the refund workflow, which sends some refunds to a human review queue. Beside the path, a 3% daily sample of conversations and the nightly golden set pass through the same evaluators, whose quality SLI pages the on-call engineer who can pull the gateway&#x27;s degradation ladder, and production failures become new golden cases.</desc>
