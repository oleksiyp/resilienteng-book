<div class="dg-figure" data-fig="fig-8-6" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-8-6-title fig-8-6-desc">
<title id="fig-8-6-title">The degradation ladder</title>
<desc id="fig-8-6-desc">Four rungs stepping down from the normal state, frontier and cheap tiers, to a pinned fallback provider, to retrieval only, to human handoff. The gateway&#x27;s circuit breakers, tripped by errors, latency or rate-limit exhaustion, pull the ladder to the fallback automatically; a sustained burn of the refund-explanation quality SLI pages the on-call engineer, who may flip a prepared switch that drops refund intents to retrieval only, because a model that is available but wrong never trips a breaker and a noisy judge-based signal is not trusted to act alone.</desc>
